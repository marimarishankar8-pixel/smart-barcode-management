
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Barcode Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-box">
    <h1>Smart Barcode</h1>
    <p>Management System</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
